<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saltroad</title>
<meta name="theme-color" content="#fbfcf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b211e" media="(prefers-color-scheme: dark)">
<meta name="description" content="Saltroad: build an empire from open land and trade with your friends for what yours cannot give you. A persistent sandbox with no clock and no winner.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23006b4f'/%3E%3Cpath d='M7 22 L16 9 L25 22' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='22' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <canvas id="map" aria-label="World map"></canvas>
  <header id="topbar" class="topbar" hidden></header>
  <aside id="side" class="side panel" hidden aria-label="Your empire"></aside>
  <section id="inspector" class="inspector panel" hidden aria-live="polite"></section>
  <nav id="nav" class="nav" hidden aria-label="Sections"></nav>
  <section id="news" class="newsfeed panel" hidden aria-label="News"></section>
  <div id="legend" class="legend panel" hidden></div>
  <div id="pickbar" class="pickbar panel" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="gate" class="gate" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
